# To learn more, please read the Rails Internationalization guide
# available at https://guides.rubyonrails.org/i18n.html.

en:
  accounts:
    create:
      success: "Account created successfully"
      error: "There was a problem setting up your account"
    update:
      success: "Account updated successfully"
      error: "There was a problem updating your account"
    destroy:
      success: "Account permanently deleted"
  check_counts:
    create:
      success: "Count updated"
      error: "Unable to update count"
  checks:
    show:
      not_trello: "Details view is only available for Trello checks"
      trello_error: "Could not load Trello cards. Check your Trello connection and try again."
    update:
      success: "Check updated"
      error: "Unable to update check"
    destroy:
      success: "Check deleted"
  groups:
    create:
      success: "Group created"
      error: "Unable to create group"
    update:
      success: "Group updated"
      error: "Unable to update group"
    destroy:
      success: "Group deleted"
      last_group: "You need at least one group, so this one can't be deleted"
